name: Validate alpha
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build:public
      - run: node scripts/release-inventory.cjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/build-windows.ps1
# Validation only. No publishing, deployment, release creation or write token.
